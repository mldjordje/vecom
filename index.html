<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vecom — prototip aplikacije za kupce i servis</title>
<link rel="icon" href="assets/vecom-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img src="assets/vecom-logo.png" alt="Vecom">
      <span class="demo-badge">DEMO<span class="long"> · PREDLOG</span></span>
    </div>
    <nav class="personas" id="personas">
      <button data-go="#/site">Sajt</button>
      <button data-go="#/login">Kupac</button>
      <button data-go="#/admin">Admin</button>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="foot">
  Prototip za sastanak — bez bekenda, svi podaci su lažni osim kataloga aparata.
  Javni sajt ostaje vecom.rs; sekcije „Sajt” su predlog blokova za ubacivanje. Nije zvanična Vecom aplikacija.
</footer>

<div class="toast" id="toast"></div>

<!-- podaci kao JS, da prototip radi i otvoren dvoklikom (file://) i offline -->
<script src="data/bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
